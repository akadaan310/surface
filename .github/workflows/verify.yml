name: Verify native source and research tools
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify immutable source
        run: python3 tools/verify_repository.py
      - name: Restore exact foundation
        timeout-minutes: 2
        run: |
          python3 -B tools/materialize_foundation.py
          python3 -B tools/materialize_foundation.py --check
      - name: Validate and replay compiled directive
        timeout-minutes: 2
        run: |
          python3 -B tools/commission.py validate --bundle commissions/2026-10-25-surface-consolidation/generated
          python3 -B tools/commission.py replay --bundle commissions/2026-10-25-surface-consolidation/generated
      - name: Native and host test suites
        timeout-minutes: 6
        run: python3 -B tools/build_native.py --test
